<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>RetroJava Emulator</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:system-ui,sans-serif;color:#0f0;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #display{image-rendering:pixelated;background:#000}
  #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#00ffa3;font-family:'Press Start 2P',monospace;font-size:11px;text-align:center;padding:20px;
    background:radial-gradient(circle at 50% 40%,#0a1a12,#000);}
  #status small{display:block;color:#8a8fb8;margin-top:10px;font-size:10px}
</style>
</head>
<body>
  <div id="status">
    Inicializando emulador...
    <br><small>CheerpJ + FreeJ2ME</small>
  </div>
  <div id="wrap"><div id="display"></div></div>

<script>
(async () => {
  const status = document.getElementById('status');
  const setStatus = (msg, sub='') =>
    status.innerHTML = msg + (sub ? `<br><small>${sub}</small>` : '');

  // ---- Get jar source ----
  const params = new URLSearchParams(location.search);
  const jarUrl = params.get('jar');
  if (!jarUrl) {
    setStatus('Nenhuma ROM carregada', 'Passe ?jar=URL_DA_ROM');
    return;
  }

  try {
    setStatus('Baixando ROM...', jarUrl.length > 60 ? jarUrl.slice(0,60)+'…' : jarUrl);
    const res = await fetch(jarUrl);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const bytes = new Uint8Array(await res.arrayBuffer());

    setStatus('Iniciando CheerpJ...', 'Primeira execução pode demorar ~10s');
    await cheerpjInit();

    // Mount user-provided jar in CheerpJ's virtual filesystem
    cheerpOSAddStringFile('/str/game.jar', bytes);

    setStatus('Carregando emulador...');
    const displayEl = document.getElementById('display');
    // 240x320 is a classic J2ME resolution; scale-to-fit via CSS
    const W = 240, H = 320;
    displayEl.style.width  = W + 'px';
    displayEl.style.height = H + 'px';

    // Fit to viewport
    const fit = () => {
      const s = Math.min(window.innerWidth / W, window.innerHeight / H);
      displayEl.style.transform = `scale(${s})`;
      displayEl.style.transformOrigin = 'center center';
    };
    window.addEventListener('resize', fit); fit();

    cheerpjCreateDisplay(W, H, displayEl);

    // Hide status once display is ready
    setTimeout(()=>status.style.display='none', 800);

    // Launch FreeJ2ME with our game jar
    await cheerpjRunMain(
      "org.recompile.freej2me.FreeJ2ME",
      "/app/app/freej2me.jar:/app/app/freej2me-sdl.jar",
      "/str/game.jar"
    );
  } catch (err) {
    console.error(err);
    setStatus('Erro ao carregar', String(err.message || err));
  }
})();

// Relay key events from parent (virtual controls in main page)
window.addEventListener('message', (ev) => {
  if (!ev.data || ev.data.type !== 'key') return;
  const { key, action } = ev.data;
  const evt = new KeyboardEvent(action || 'keydown', { key, bubbles:true });
  document.dispatchEvent(evt);
  document.body.dispatchEvent(evt);
});
</script>
</body>
</html>
